    function loadJobApplications(jobId, container, job) {
      jobsState.applications[jobId] = { status: 'loading', data: null, errorMessage: '' };
      clearChildren(container);
      container.appendChild(buildStateMessage('Loading applications…', false));

      google.script.run
        .withSuccessHandler(function (result) {
          jobsState.applications[jobId] = { status: 'ok', data: result, errorMessage: '' };
          renderJobApplications(container, result, job);
        })
        .withFailureHandler(function (err) {
          var msg = (err && err.message) ? err.message : 'Applications are unavailable right now.';
          jobsState.applications[jobId] = { status: 'error', data: null, errorMessage: msg };
          clearChildren(container);
          container.appendChild(buildStateMessage(msg, true));
          container.appendChild(buildRetryButton(function () { loadJobApplications(jobId, container, job); }));
        })
        .getApplicationsByJobId(jobId);
    }

    function renderJobApplications(container, appsList, job) {
      clearChildren(container);
      if (!appsList || appsList.length === 0) {
        container.appendChild(buildStateMessage('No application recorded for this job yet.', false));

        var recordBtn = document.createElement('button');
        recordBtn.type = 'button';
        recordBtn.className = 'secondary-button';
        recordBtn.textContent = 'Record application';
        var formBox = document.createElement('div');
        formBox.hidden = true;
        recordBtn.addEventListener('click', function () {
          formBox.hidden = !formBox.hidden;
          recordBtn.textContent = formBox.hidden ? 'Record application' : 'Cancel recording';
        });
        container.appendChild(recordBtn);
        formBox.appendChild(buildCreateApplicationForm(job, container));
        container.appendChild(formBox);
        return;
      }

      appsList.forEach(function (app) {
        container.appendChild(buildApplicationCard(app, job, container));
      });
    }

    function buildCreateApplicationForm(job, parentContainer) {
      var form = document.createElement('form');
      form.className = 'app-form';

      var notice = document.createElement('p');
      notice.className = 'app-notice';
      notice.textContent = 'Marking Applied records an application you submitted outside this dashboard. This dashboard never submits applications to employers.';
      form.appendChild(notice);

      var statusField = document.createElement('div');
      statusField.className = 'field';
      var statusLabel = document.createElement('label');
      var statusId = 'app-create-status-' + job.id;
      statusLabel.setAttribute('for', statusId);
      statusLabel.textContent = 'Application status';
      var statusSelect = document.createElement('select');
      statusSelect.id = statusId;
      var optDraft = document.createElement('option');
      optDraft.value = 'Draft';
      optDraft.textContent = 'Draft (preparing materials)';
      var optApplied = document.createElement('option');
      optApplied.value = 'Applied';
      optApplied.textContent = 'Applied (recorded submission elsewhere)';
      statusSelect.appendChild(optDraft);
      statusSelect.appendChild(optApplied);
      statusField.appendChild(statusLabel);
      statusField.appendChild(statusSelect);
      form.appendChild(statusField);

      var appliedDateField = document.createElement('div');
      appliedDateField.className = 'field';
      var appliedDateLabel = document.createElement('label');
      var appliedDateId = 'app-create-applied-date-' + job.id;
      appliedDateLabel.setAttribute('for', appliedDateId);
      appliedDateLabel.textContent = 'Applied date';
      var appliedDateInput = document.createElement('input');
      appliedDateInput.type = 'date';
      appliedDateInput.id = appliedDateId;
      appliedDateField.appendChild(appliedDateLabel);
      appliedDateField.appendChild(appliedDateInput);
      form.appendChild(appliedDateField);

      var contactField = document.createElement('div');
      contactField.className = 'field';
      var contactLabel = document.createElement('label');
      var contactId = 'app-create-contact-' + job.id;
      contactLabel.setAttribute('for', contactId);
      contactLabel.textContent = 'Contact name';
      var contactInput = document.createElement('input');
      contactInput.type = 'text';
      contactInput.id = contactId;
      contactInput.maxLength = 100;
      contactField.appendChild(contactLabel);
      contactField.appendChild(contactInput);
      form.appendChild(contactField);

      var emailField = document.createElement('div');
      emailField.className = 'field';
      var emailLabel = document.createElement('label');
      var emailId = 'app-create-email-' + job.id;
      emailLabel.setAttribute('for', emailId);
      emailLabel.textContent = 'Contact email';
      var emailInput = document.createElement('input');
      emailInput.type = 'email';
      emailInput.id = emailId;
      emailInput.maxLength = 150;
      emailField.appendChild(emailLabel);
      emailField.appendChild(emailInput);
      form.appendChild(emailField);

      var notesField = document.createElement('div');
      notesField.className = 'field';
      var notesLabel = document.createElement('label');
      var notesId = 'app-create-notes-' + job.id;
      notesLabel.setAttribute('for', notesId);
      notesLabel.textContent = 'Notes';
      var notesInput = document.createElement('textarea');
      notesInput.id = notesId;
      notesInput.maxLength = 1000;
      notesField.appendChild(notesLabel);
      notesField.appendChild(notesInput);
      form.appendChild(notesField);

      var errorP = document.createElement('p');
      errorP.className = 'state-message is-error';
      errorP.hidden = true;
      form.appendChild(errorP);

      var submitBtn = document.createElement('button');
      submitBtn.type = 'submit';
      submitBtn.textContent = 'Save application record';
      form.appendChild(submitBtn);

      form.addEventListener('submit', function (evt) {
        evt.preventDefault();
        var pendingKey = 'new-' + job.id;
        if (jobsState.appPending[pendingKey]) return;

        var input = {
          job_id: job.id,
          status: statusSelect.value
        };
        if (appliedDateInput.value) input.applied_at = appliedDateInput.value;
        if (contactInput.value.trim()) input.contact_name = contactInput.value.trim();
        if (emailInput.value.trim()) input.contact_email = emailInput.value.trim();
        if (notesInput.value.trim()) input.notes = notesInput.value.trim();

        jobsState.appPending[pendingKey] = true;
        submitBtn.disabled = true;
        errorP.hidden = true;

        google.script.run
          .withSuccessHandler(function () {
            delete jobsState.appPending[pendingKey];
            delete jobsState.applications[job.id];
            announce('Application record saved.');
            loadJobsQueue(true);
            loadJobApplications(job.id, parentContainer, job);
          })
          .withFailureHandler(function (err) {
            delete jobsState.appPending[pendingKey];
            submitBtn.disabled = false;
            var code = err && err.code ? err.code : '';
            var msg = 'Could not save application record. Refresh and try again.';
            if (code === 'ACTIVE_APPLICATION_EXISTS') {
              msg = 'An active application already exists for this job.';
            } else if (code === 'INVALID_TRANSITION') {
              msg = 'This status is not permitted from the job\'s current state.';
            } else if (code === 'UNKNOWN_FIELD') {
              msg = 'An unsupported field was rejected by the server.';
            }
            errorP.textContent = msg;
            errorP.hidden = false;
            announceAlert(msg);
          })
          .createApplication(input);
      });

      return form;
    }

    function buildApplicationCard(app, job, parentContainer) {
      var card = document.createElement('div');
      card.className = 'application-card';

      var header = document.createElement('div');
      header.className = 'app-header';
      var title = document.createElement('strong');
      title.textContent = 'Application Record';
      header.appendChild(title);

      var badge = document.createElement('span');
      badge.className = 'app-status-badge app-status-' + app.status;
      badge.textContent = app.status;
      header.appendChild(badge);
      card.appendChild(header);

      var metaList = document.createElement('ul');
      metaList.className = 'app-meta-list';

      function addMeta(label, val) {
        var li = document.createElement('li');
        var str = document.createElement('strong');
        str.textContent = label + ': ';
        li.appendChild(str);
        li.appendChild(document.createTextNode(val));
        metaList.appendChild(li);
      }

      addMeta('Status', app.status);
      addMeta('Applied', app.applied_at ? formatDateOnlyForDisplay(app.applied_at) : 'Not yet applied');
      if (app.follow_up_at) addMeta('Follow-up', formatDateOnlyForDisplay(app.follow_up_at));
      if (app.contact_name || app.contact_email) {
        addMeta('Contact', (app.contact_name || '') + (app.contact_email ? ' (' + app.contact_email + ')' : ''));
      }
      if (app.interview_at) addMeta('Interview', formatDateOnlyForDisplay(app.interview_at));
      if (app.notes) addMeta('Notes', app.notes);
      if (app.outcome) addMeta('Outcome', app.outcome);
      card.appendChild(metaList);

      var actions = document.createElement('div');
      actions.className = 'app-actions';
      var allowedTargets = APPLICATION_TRANSITIONS_MAP[app.status] || [];
      var isPending = !!jobsState.appPending[app.id];

      allowedTargets.forEach(function (targetStatus) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.disabled = isPending;
        if (targetStatus === 'Applied') {
          btn.textContent = 'Record as applied';
        } else if (targetStatus === 'Interview') {
          btn.textContent = 'Record interview';
        } else if (targetStatus === 'Offered') {
          btn.textContent = 'Record offer';
        } else if (targetStatus === 'Rejected') {
          btn.textContent = 'Record rejection';
          btn.className = 'is-destructive';
        } else if (targetStatus === 'Withdrawn') {
          btn.textContent = 'Withdraw';
          btn.className = 'is-destructive';
        } else {
          btn.textContent = 'Mark ' + targetStatus;
        }

        btn.setAttribute('aria-label', btn.textContent + ' for application on ' + job.title);
        btn.addEventListener('click', function () {
          runApplicationStatusAction(app.id, targetStatus, btn.textContent, job, parentContainer);
        });
        actions.appendChild(btn);
      });

      var editToggleBtn = document.createElement('button');
      editToggleBtn.type = 'button';
      editToggleBtn.textContent = 'Edit details';
      editToggleBtn.disabled = isPending;
      actions.appendChild(editToggleBtn);
      card.appendChild(actions);

      var editFormBox = document.createElement('div');
      editFormBox.hidden = true;
      editToggleBtn.addEventListener('click', function () {
        editFormBox.hidden = !editFormBox.hidden;
        editToggleBtn.textContent = editFormBox.hidden ? 'Edit details' : 'Cancel edit';
      });
      editFormBox.appendChild(buildEditApplicationForm(app, job, parentContainer));
      card.appendChild(editFormBox);

      var historyDetails = document.createElement('details');
      historyDetails.className = 'app-history-details';
      var historySummary = document.createElement('summary');
      historySummary.textContent = 'View application history';
      historyDetails.appendChild(historySummary);

      var historyBody = document.createElement('div');
      historyDetails.appendChild(historyBody);

      historyDetails.addEventListener('toggle', function () {
        if (historyDetails.open && (!jobsState.appHistories[app.id] || jobsState.appHistories[app.id].status === 'not-loaded')) {
          loadApplicationHistory(app.id, historyBody);
        }
      });
      card.appendChild(historyDetails);

      return card;
    }

    function runApplicationStatusAction(applicationId, targetStatus, label, job, parentContainer) {
      if (jobsState.appPending[applicationId]) return;
      jobsState.appPending[applicationId] = true;
      renderJobApplications(parentContainer, jobsState.applications[job.id] ? jobsState.applications[job.id].data : [], job);

      google.script.run
        .withSuccessHandler(function () {
          delete jobsState.appPending[applicationId];
          delete jobsState.appHistories[applicationId];
          delete jobsState.applications[job.id];
          announce(label + ' recorded.');
          loadJobsQueue(true);
          loadJobApplications(job.id, parentContainer, job);
        })
        .withFailureHandler(function (err) {
          delete jobsState.appPending[applicationId];
          var code = err && err.code ? err.code : '';
          var msg = 'The status change could not be completed.';
          if (code === 'CONFLICT') {
            msg = 'This application changed before the request completed. Refresh and try again.';
          } else if (code === 'INVALID_TRANSITION') {
            msg = 'That status transition is not permitted from the current state.';
          }
          announceAlert(msg);
          loadJobApplications(job.id, parentContainer, job);
        })
        .setApplicationStatus(applicationId, targetStatus, '');
    }

    function buildEditApplicationForm(app, job, parentContainer) {
      var form = document.createElement('form');
      form.className = 'app-form';

      var contactField = document.createElement('div');
      contactField.className = 'field';
      var contactLabel = document.createElement('label');
      var contactId = 'app-edit-contact-' + app.id;
      contactLabel.setAttribute('for', contactId);
      contactLabel.textContent = 'Contact name';
      var contactInput = document.createElement('input');
      contactInput.type = 'text';
      contactInput.id = contactId;
      contactInput.value = app.contact_name || '';
      contactInput.maxLength = 100;
      contactField.appendChild(contactLabel);
      contactField.appendChild(contactInput);
      form.appendChild(contactField);

      var emailField = document.createElement('div');
      emailField.className = 'field';
      var emailLabel = document.createElement('label');
      var emailId = 'app-edit-email-' + app.id;
      emailLabel.setAttribute('for', emailId);
      emailLabel.textContent = 'Contact email';
      var emailInput = document.createElement('input');
      emailInput.type = 'email';
      emailInput.id = emailId;
      emailInput.value = app.contact_email || '';
      emailInput.maxLength = 150;
      emailField.appendChild(emailLabel);
      emailField.appendChild(emailInput);
      form.appendChild(emailField);

      var followUpField = document.createElement('div');
      followUpField.className = 'field';
      var followUpLabel = document.createElement('label');
      var followUpId = 'app-edit-followup-' + app.id;
      followUpLabel.setAttribute('for', followUpId);
      followUpLabel.textContent = 'Follow-up date';
      var followUpInput = document.createElement('input');
      followUpInput.type = 'date';
      followUpInput.id = followUpId;
      followUpInput.value = app.follow_up_at || '';
      followUpField.appendChild(followUpLabel);
      followUpField.appendChild(followUpInput);
      form.appendChild(followUpField);

      var notesField = document.createElement('div');
      notesField.className = 'field';
      var notesLabel = document.createElement('label');
      var notesId = 'app-edit-notes-' + app.id;
      notesLabel.setAttribute('for', notesId);
      notesLabel.textContent = 'Notes';
      var notesInput = document.createElement('textarea');
      notesInput.id = notesId;
      notesInput.value = app.notes || '';
      notesInput.maxLength = 1000;
      notesField.appendChild(notesLabel);
      notesField.appendChild(notesInput);
      form.appendChild(notesField);

      var errorP = document.createElement('p');
      errorP.className = 'state-message is-error';
      errorP.hidden = true;
      form.appendChild(errorP);

      var saveBtn = document.createElement('button');
      saveBtn.type = 'submit';
      saveBtn.textContent = 'Save details';
      form.appendChild(saveBtn);

      form.addEventListener('submit', function (evt) {
        evt.preventDefault();
        if (jobsState.appPending[app.id]) return;

        var updates = {
          contact_name: contactInput.value.trim(),
          contact_email: emailInput.value.trim(),
          follow_up_at: followUpInput.value,
          notes: notesInput.value.trim()
        };

        jobsState.appPending[app.id] = true;
        saveBtn.disabled = true;
        errorP.hidden = true;

        google.script.run
          .withSuccessHandler(function () {
            delete jobsState.appPending[app.id];
            delete jobsState.applications[job.id];
            announce('Application details updated.');
            loadJobApplications(job.id, parentContainer, job);
          })
          .withFailureHandler(function (err) {
            delete jobsState.appPending[app.id];
            saveBtn.disabled = false;
            var code = err && err.code ? err.code : '';
            var msg = 'Could not update application details.';
            if (code === 'CONFLICT') {
              msg = 'This application changed before the request completed. Refresh and try again.';
            } else if (code === 'FORBIDDEN_FIELD') {
              msg = 'Attempted to modify a protected application field.';
            }
            errorP.textContent = msg;
            errorP.hidden = false;
            announceAlert(msg);
          })
          .updateApplication(app.id, updates);
      });

      return form;
    }

    function loadApplicationHistory(applicationId, container) {
      jobsState.appHistories[applicationId] = { status: 'loading', data: null, errorMessage: '' };
      clearChildren(container);
      container.appendChild(buildStateMessage('Loading application history…', false));

      google.script.run
        .withSuccessHandler(function (result) {
          if (result && result.status === 'ok') {
            jobsState.appHistories[applicationId] = { status: 'ok', data: result, errorMessage: '' };
            renderApplicationHistory(container, result);
          } else {
            var msg = (result && result.message) ? result.message : 'Application history is unavailable right now.';
            jobsState.appHistories[applicationId] = { status: 'error', data: null, errorMessage: msg };
            clearChildren(container);
            container.appendChild(buildStateMessage(msg, true));
          }
        })
        .withFailureHandler(function (err) {
          var msg = (err && err.message) ? err.message : 'Application history is unavailable right now.';
          jobsState.appHistories[applicationId] = { status: 'error', data: null, errorMessage: msg };
          clearChildren(container);
          container.appendChild(buildStateMessage(msg, true));
        })
        .getApplicationHistory(applicationId);
    }

    function renderApplicationHistory(container, envelope) {
      clearChildren(container);
      if (!envelope.entries || envelope.entries.length === 0) {
        container.appendChild(buildStateMessage('No recorded application activity yet.', false));
        return;
      }

      var ul = document.createElement('ul');
      ul.className = 'job-history-list';
      envelope.entries.forEach(function (entry) {
        var li = document.createElement('li');
        var p = document.createElement('p');
        p.textContent = entry.action + (entry.toStatus ? ': → ' + entry.toStatus : '');
        li.appendChild(p);

        if (entry.note) {
          var noteP = document.createElement('p');
          noteP.textContent = entry.note;
          li.appendChild(noteP);
        }

        var timeSpan = document.createElement('span');
        timeSpan.className = 'job-history-time';
        timeSpan.textContent = formatDateTimeForDisplay(entry.createdAt);
        li.appendChild(timeSpan);
        ul.appendChild(li);
      });
      container.appendChild(ul);

      if (envelope.quarantinedCount > 0) {
        container.appendChild(buildStateMessage(envelope.quarantinedCount + ' malformed history record(s) were skipped.', true));
      }
    }

    // ---------------------------------------------------------------------
    // Calendar — loaded and rendered fully independently of dashboardState
    // so a slow or failing Calendar can never block Home or Tasks.
    // ---------------------------------------------------------------------
    var calendarState = {
      status: 'loading', // 'loading' | 'ok' | 'unavailable' | 'failed'
      events: [],
      message: ''
    };

    function loadCalendarEvents() {
      calendarState.status = 'loading';
      renderCalendarBody();

      google.script.run
        .withSuccessHandler(function (result) {
          if (result && result.status === 'ok') {
            calendarState.status = 'ok';
            calendarState.events = result.events || [];
            calendarState.message = '';
          } else {
            calendarState.status = 'unavailable';
            calendarState.events = [];
            calendarState.message = (result && result.message) ? result.message : 'Calendar is not available right now.';
          }
          renderCalendarBody();
        })
        .withFailureHandler(function (err) {
          calendarState.status = 'failed';
          calendarState.events = [];
          calendarState.message = (err && err.message) ? err.message : 'Could not reach the calendar service.';
          renderCalendarBody();
        })
        .getUpcomingEvents();
    }

    function renderCalendarBody() {
      var container = calendarBodyEl;

      if (calendarState.status === 'loading') {
        container.setAttribute('aria-busy', 'true');
        clearChildren(container);
        container.appendChild(buildStateMessage('Loading upcoming events…', false));
        return;
      }

      container.setAttribute('aria-busy', 'false');
      clearChildren(container);

      if (calendarState.status === 'failed' || calendarState.status === 'unavailable') {
        container.appendChild(buildStateMessage(calendarState.message, true));
        container.appendChild(buildRetryButton(loadCalendarEvents));
        return;
      }

      // status === 'ok'
      if (calendarState.events.length === 0) {
        container.appendChild(buildStateMessage('No upcoming events in the next 7 days.', false));
        return;
      }

      var ul = document.createElement('ul');
      ul.className = 'events-list';
      calendarState.events.forEach(function (ev) {
        ul.appendChild(buildEventListItem(ev));
      });
      container.appendChild(ul);
    }

    function buildEventListItem(ev) {
      var li = document.createElement('li');

      var titleEl = document.createElement('span');
      titleEl.className = 'event-title';
      titleEl.textContent = ev.title;
      li.appendChild(titleEl);

      var timeEl = document.createElement('span');
      timeEl.className = 'event-time';
      timeEl.textContent = ev.allDay
        ? 'All day · ' + formatIsoDateOnlyForDisplay(ev.start)
        : formatDateTimeForDisplay(ev.start) + ' – ' + formatDateTimeForDisplay(ev.end);
      li.appendChild(timeEl);

      return li;
    }

    // ---------------------------------------------------------------------
    // Initial load. The Home view is already the visible one per the
    // static markup, so no switchView() call is needed (and none is made,
    // to avoid stealing keyboard focus on page load).
    // ---------------------------------------------------------------------
    loadDashboardData(false);
    loadCalendarEvents();
  })();
</script>

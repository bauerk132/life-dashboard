<style>
  :root { --ink:#172033; --muted:#64748b; --paper:#f6f8fc; --card:#fff; --line:#dce3ef; --blue:#2563eb; --navy:#12244b; --green:#047857; --amber:#b45309; }

  button,input,select { font:inherit; } button { cursor:pointer; } .shell { max-width:1120px; margin:auto; padding:32px 20px 60px; }
  .topbar { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; } h1 { margin:3px 0 0; font-size:clamp(28px,4vw,42px); letter-spacing:-.045em; } .eyebrow { margin:0; color:var(--blue); font-size:11px; font-weight:800; letter-spacing:.11em; } .today,.muted { color:var(--muted); }

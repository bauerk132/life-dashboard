<script>
  const state = { data: null, jobFilter: 'all' };
  const $ = (selector) => document.querySelector(selector);
  const escapeHtml = (value) => String(value || '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const formatMoney = (min, max) => min || max ? `$${Number(min || 0).toLocaleString()}–$${Number(max || 0).toLocaleString()}` : 'Salary not listed';
  const formatDate = (value) => value ? new Date(value).toLocaleDateString(undefined,{month:'short',day:'numeric'}) : 'No due date';
  const call = (name, ...args) => new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));

  function el(tag, className, textContent, attributes = {}) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (textContent) element.textContent = textContent;
    for (const [key, value] of Object.entries(attributes)) {
      element.setAttribute(key, value);
    }
    return element;
  }

  document.addEventListener('DOMContentLoaded', loadDashboard);
  async function loadDashboard() {
    try { state.data = await call('getDashboardData'); render(); }
    catch (error) { $('#loading').textContent = error.message || 'Could not load dashboard.'; }
  }
  function render() {
    $('#loading').classList.add('hidden'); $('#today').textContent = state.data.today;
    $('#readyBadge').textContent = state.data.stats.readyJobs;
    renderHome(); renderJobs(); renderTasks(); showView('home');
  }
  function showView(view) {
    document.querySelectorAll('.view').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.view === view));
    $('#' + view).classList.remove('hidden');
  }
  document.querySelectorAll('.tab').forEach(button => button.addEventListener('click', () => showView(button.dataset.view)));

  function renderHome() {
    const { stats, tasks, events } = state.data;
    const home = $('#home');
    home.textContent = '';

    const statsGrid = el('div', 'grid stats');
    const statsData = [
      { label: 'Open tasks', metric: stats.openTasks },
      { label: 'Completed tasks', metric: stats.completedTasks },
      { label: 'Strong-match jobs', metric: stats.readyJobs },
      { label: 'Applications sent', metric: stats.appliedJobs }
    ];
    statsData.forEach(s => {
      const card = el('article', 'card');
      card.appendChild(el('div', 'label', s.label));
      card.appendChild(el('div', 'metric', s.metric));
      statsGrid.appendChild(card);
    });
    home.appendChild(statsGrid);

    const twoGrid = el('div', 'grid two');
    twoGrid.style.marginTop = '16px';

    const eventsCard = el('article', 'card');
    eventsCard.appendChild(el('h2', 'section-title', 'Next up'));
    eventsCard.appendChild(el('p', 'muted', 'From your Google Calendar'));
    if (events.length) {
      events.forEach(e => {
        const row = el('div', 'row');
        row.appendChild(el('span', '', e.title));
        const time = e.allDay ? 'All day' : new Date(e.start).toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'});
        row.appendChild(el('span', 'muted', time));
        eventsCard.appendChild(row);
      });
    } else {
      eventsCard.appendChild(el('p', 'empty', 'No calendar events to show. Calendar permission is optional.'));
    }
    twoGrid.appendChild(eventsCard);

    const tasksCard = el('article', 'card');
    tasksCard.appendChild(el('h2', 'section-title', 'Today’s tasks'));
    const topTasks = tasks.slice(0, 5);
    if (topTasks.length) {
      topTasks.forEach(task => tasksCard.appendChild(taskRow(task)));
    } else {
      tasksCard.appendChild(el('p', 'empty', 'No tasks yet.'));
    }
    twoGrid.appendChild(tasksCard);

    home.appendChild(twoGrid);
  }

  function renderJobs() {
    const jobs = state.data.jobs.filter(job => state.jobFilter === 'all' || (state.jobFilter === 'strong' && Number(job.overall_match) >= 90) || (state.jobFilter === 'remote' && String(job.remote).toLowerCase().includes('remote')) || (state.jobFilter === 'saved' && ['Saved','Ready to Apply'].includes(job.status)));
    const jobsContainer = $('#jobs');
    jobsContainer.textContent = '';

    const toolbar = el('div', 'job-toolbar');
    const title = el('h2', 'section-title', 'Ready-to-go jobs');
    title.style.marginRight = 'auto';
    toolbar.appendChild(title);

    const filters = [['all','All'],['strong','90%+ match'],['remote','Remote'],['saved','Saved']];
    filters.forEach(([id,label]) => {
      const btn = el('button', `filter ${state.jobFilter===id?'active':''}`, label, { 'data-filter': id });
      btn.addEventListener('click', () => { state.jobFilter = id; renderJobs(); });
      toolbar.appendChild(btn);
    });
    jobsContainer.appendChild(toolbar);

    const jobList = el('div', 'job-list');
    if (jobs.length) {
      jobs.forEach(job => jobList.appendChild(jobCard(job)));
    } else {
      jobList.appendChild(el('article', 'card empty', 'No jobs match this filter.'));
    }
    jobsContainer.appendChild(jobList);
  }

  function jobCard(job) {
    const card = el('article', 'card job-card');

    const head = el('div', 'job-head');
    const headLeft = el('div');
    headLeft.appendChild(el('h3', 'job-title', job.title));
    headLeft.appendChild(el('p', 'company', `${job.company} · ${job.location}`));
    head.appendChild(headLeft);
    const score = el('div', 'score', job.overall_match || '—');
    score.appendChild(el('span', '', 'MATCH'));
    head.appendChild(score);
    card.appendChild(head);

    const pills = el('div', 'pills');
    pills.appendChild(el('span', 'pill', job.remote || 'Location unknown'));
    pills.appendChild(el('span', 'pill', formatMoney(job.salary_min,job.salary_max)));
    pills.appendChild(el('span', 'pill', job.recommendation || 'Unscored'));
    pills.appendChild(el('span', 'pill', job.status));
    card.appendChild(pills);

    const reason = el('div', 'reason');
    const whyMatches = el('div');
    whyMatches.appendChild(el('strong', '', 'Why it matches '));
    whyMatches.appendChild(document.createTextNode(job.why_matches || 'Awaiting scoring'));
    reason.appendChild(whyMatches);
    const gaps = el('div');
    gaps.appendChild(el('strong', '', 'Possible gaps '));
    gaps.appendChild(document.createTextNode(job.gaps || 'None identified'));
    reason.appendChild(gaps);
    card.appendChild(reason);

    const actions = el('div', 'actions');
    const reviewedBtn = el('button', 'button', 'Reviewed', { 'data-id': job.id, 'data-job-status': 'Reviewed' });
    reviewedBtn.addEventListener('click', () => changeJobStatus(job.id, 'Reviewed'));
    actions.appendChild(reviewedBtn);

    const saveBtn = el('button', 'button primary', 'Save', { 'data-id': job.id, 'data-job-status': 'Saved' });
    saveBtn.addEventListener('click', () => changeJobStatus(job.id, 'Saved'));
    actions.appendChild(saveBtn);

    const applyBtn = el('button', 'button', 'Ready to apply', { 'data-id': job.id, 'data-job-status': 'Ready to Apply' });
    applyBtn.addEventListener('click', () => changeJobStatus(job.id, 'Ready to Apply'));
    actions.appendChild(applyBtn);

    if (job.url) {
      const link = el('a', 'button', 'View job', { href: job.url, target: '_blank', rel: 'noopener' });
      actions.appendChild(link);
    }

    const rejectBtn = el('button', 'button danger', 'Reject', { 'data-id': job.id, 'data-job-status': 'Rejected' });
    rejectBtn.addEventListener('click', () => changeJobStatus(job.id, 'Rejected'));
    actions.appendChild(rejectBtn);

    card.appendChild(actions);
    return card;
  }

  function renderTasks() {
    const tasksContainer = $('#tasks');
    tasksContainer.textContent = '';

    const card = el('article', 'card');
    card.appendChild(el('h2', 'section-title', 'Tasks'));
    card.appendChild(el('p', 'muted', 'Changes save straight to your Tasks sheet.'));

    const form = el('form', 'task-form');
    form.id = 'taskForm';
    const inputTitle = el('input', 'field', '', { name: 'title', required: 'true', placeholder: 'Add a task' });
    form.appendChild(inputTitle);
    const inputDate = el('input', 'field', '', { name: 'dueDate', type: 'date' });
    form.appendChild(inputDate);
    const selectPriority = el('select', 'field', '', { name: 'priority' });
    ['Medium', 'High', 'Low'].forEach(p => selectPriority.appendChild(el('option', '', p)));
    form.appendChild(selectPriority);
    const addBtn = el('button', 'button primary', 'Add task');
    form.appendChild(addBtn);
    form.addEventListener('submit', addTask);
    card.appendChild(form);

    const list = el('div');
    if (state.data.tasks.length) {
      state.data.tasks.forEach(task => list.appendChild(taskRow(task)));
    } else {
      list.appendChild(el('p', 'empty', 'No tasks yet.'));
    }
    card.appendChild(list);

    tasksContainer.appendChild(card);
  }

  function taskRow(task) {
    const done = task.status === 'Done';
    const row = el('div', 'row');

    const info = el('div');
    info.appendChild(el('strong', done ? 'done' : '', task.title));
    const muted = el('div', 'muted', `${formatDate(task.due_date)} · `);
    muted.appendChild(el('span', `priority ${task.priority}`, task.priority));
    info.appendChild(muted);
    row.appendChild(info);

    const btn = el('button', 'button', done ? 'Reopen' : 'Complete', { 'data-task-id': task.id, 'data-task-status': done ? 'Open' : 'Done' });
    btn.addEventListener('click', () => changeTaskStatus(task.id, done ? 'Open' : 'Done'));
    row.appendChild(btn);

    return row;
  }

  async function addTask(event) { event.preventDefault(); const form = new FormData(event.target); await runAction(() => call('createTask',{title:form.get('title'),dueDate:form.get('dueDate'),priority:form.get('priority')}),'Task added.'); }
  async function changeTaskStatus(id,status) { await runAction(() => call('setTaskStatus',id,status), status === 'Done' ? 'Task completed.' : 'Task reopened.'); }
  async function changeJobStatus(id,status) { await runAction(() => call('setJobStatus',id,status), `Job marked ${status}.`); }
  async function runAction(action, message) { try { await action(); state.data = await call('getDashboardData'); render(); $('#message').textContent = message; } catch(error) { $('#message').textContent = error.message || 'That change could not be saved.'; } }
</script>
